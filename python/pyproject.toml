[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-builder-adapter-python"
version = "0.2.0"
description = "Python SDK adapter for cli-builder — extracts SdkMetadata from Python packages"
requires-python = ">=3.10"
license = {text = "EUPL-1.2"}
authors = [{name = "Jakub Lehotsky"}]
dependencies = [
    "typing_extensions >= 4.6",
]

[project.scripts]
cli-builder-adapter-python = "cli_builder_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov", "jsonschema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
