[workspace]
members = ["crates/cli-builder-core", "crates/cli-builder-gen-python", "crates/cli-builder-gen-csharp", "crates/cli-builder", "crates/mock-adapter"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = "1"
clap = { version = "4", features = ["derive"] }
