[package]
name = "cli-builder-gen-python"
version = "0.2.2"
edition = "2021"
description = "Python CLI generator for cli-builder — click-based output from SdkMetadata JSON"
license = "EUPL-1.2"

[dependencies]
cli-builder-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
tera = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
cli-builder-core = { path = "../core", features = ["test-support"] }
tempfile = "3"
walkdir = "2"
insta = "1"
