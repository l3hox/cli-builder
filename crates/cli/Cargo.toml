[package]
name = "cli-builder"
version = "0.2.0"
edition = "2021"
description = "Generate agent-ready CLIs from SDK packages — any language in, any language out"
license = "EUPL-1.2"

[[bin]]
name = "cli-builder"
path = "src/main.rs"

[dependencies]
cli-builder-core = { path = "../core" }
cli-builder-gen-python = { path = "../gen-python" }
cli-builder-gen-csharp = { path = "../gen-csharp" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = "3"
walkdir = "2"
