version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /crates
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: nuget
    directory: /dotnet
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
