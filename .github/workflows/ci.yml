# CI gate — runs all tests on every PR and push to main.
# Phase 1 green bar means per-language tests pass on all three OSes.
# It does NOT mean cross-language orchestrator wiring works (Phase 2)
# or that the binary is releasable (Phase 3).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
      # Python + click are required by the generator's runtime anchor test
      # (help_output_snapshot spawns `python -m testsdk_cli --help`). The
      # test skips gracefully if click isn't importable, but we want it to
      # actually RUN in CI, not silently no-op.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install click
        shell: bash
      - run: cargo test --workspace --all-features

  dotnet:
    name: .NET (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          # global-json-file path is repo-root-relative, even though the job's
          # working-directory is `dotnet`. Don't "correct" this to `global.json`.
          global-json-file: dotnet/global.json
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: pip install -e ".[test]"
      - run: pytest
